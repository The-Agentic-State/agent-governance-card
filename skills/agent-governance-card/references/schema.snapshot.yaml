# Agent Governance Card — canonical machine-readable schema (card v0.3)
# Canonical source of truth for the card's fields, interview questions, and
# Impact-Level derivation. Any face of the card (skill, form, document, table,
# slides) should read THIS file; do not carry frozen copies of the fields.
#
# v0.3 (2026-07-24) supersedes the v0.2 instrument used for the 20-deployment
# stress test, and applies that round's legal-review decisions: the card NEVER
# blocks (verdicts become to_resolve advisories; a pending C7 makes the level
# provisional, not forbidden); C7a determination record (memo-backed, M-25-21 §4(a)); disclosure
# promoted to Core (C22, was E14a); unknown-floored Moderates route to a
# reduced Extended set. Derivation contract bumped 1 -> 2. Field ids (C*/E*)
# are stable machine handles; rendered faces show labels and questions, not ids.
#
# Two stability tiers:
#   - CONTENT LAYER (freely editable): questions, glosses, help text, examples,
#     ordering, non-derivation fields, scope/unit wording, public/comparability
#     tags. Edit anytime; the next run picks it up.
#   - DERIVATION CONTRACT (versioned): the ids and enum values feeding the
#     Impact derivation (C7, C8, C10, C11, C11a, C12) plus the impact_derivation
#     rules below. Changing any of these requires bumping
#     derivation_contract_version; the derivation engine
#     (skills/agent-governance-card/scripts/derive_impact.py) is pinned to a
#     contract version and
#     refuses to compute on a mismatch rather than miscompute a tier.
#
# After editing: re-copy this file to
# skills/agent-governance-card/references/schema.snapshot.yaml (the skill ships
# with a byte-identical copy) and re-run the engine's anchor check
# (see schema/README.md).

schema: agent-governance-card
card_version: "0.3"
derivation_contract_version: 2
updated: "2026-07-24"

# The card is a voluntary instrument: it records, computes, and recommends —
# it never blocks. Its to_resolve recommendations acquire binding force only
# where an adopting authority (e.g. a state CIO or agency directive) makes a
# completed card a precondition for production access. Say so when presenting
# verdicts; never present a recommendation as a prohibition.
adoption: >
  Voluntary instrument. to_resolve items are strong recommendations; they become
  gates only where an adopting directive makes the completed card a precondition
  for production access.

# R6: the answer-status vocabulary is now part of the card, not just the instrument.
answer_statuses: [answered, unknown, not_applicable, not_in_place]
# unknown = the fact exists but can't be determined; not_in_place = the mechanism
# does not exist (a governance finding). Both are legal everywhere — but an unknown
# on an operational-tier derivation input floors the tier at Moderate (see below).

# R5: scope trigger + unit of analysis (front matter; not fields).
scope_trigger:
  card_required_if: >
    (interacts directly with the public) OR (materially influences a decision-making
    process with effect on the public or state resources), AND takes actions or
    produces outputs beyond returning static search results.
  out_of_scope: >
    embedded commodity features (autocomplete, spell-check, in-app summarization) and
    purely predictive back-office models — record in AI inventory; use an
    impact-assessment instrument for consequential predictive models.
  out_of_scope_boundary_test: >
    for the embedded-commodity carve-out, apply M-25-22 §2(b)'s two-part test: exempt
    only if (1) the product is widely available to the public for commercial use, AND
    (2) the AI is embedded in a product with substantial non-AI purposes. A product
    used primarily FOR its AI functionality (e.g. a licensed copilot) is in scope.
  scope_vs_c7_note: >
    intentional asymmetry with C7: the scope trigger ("materially influences a
    decision-making process") casts wider than C7's "principal basis" test. Scope
    decides whether a card exists at all; C7 is the legal test that decides the
    level. Many agents get a card and honestly answer C7 not_high_impact.
unit_of_analysis:
  one_card: one agent deployment in one operational context.
  platform_pattern: >
    parent card (shared layer: model, vendor, identity architecture, exit terms) +
    one deployment addendum per context (purpose, data touched, autonomy, function).

core_fields:
  - id: C1
    label: Name
    question: "What is the agent called?"
    group: identity
    type: text
    public: true
  - id: C2
    label: What it is, in plain language
    question: "What is it, in plain language? (2-3 sentences)"
    group: identity
    type: text
    public: true
  - id: C3
    label: Purpose / what it's for
    question: "What is it for — what task or service does it perform?"
    group: identity
    type: text
    public: true
  - id: C4
    label: Agent type
    question: "Which agent type is it?"
    group: identity
    type: enum
    comparability: true
    public: true
    values: [assistant_copilot, autonomous_single, orchestrator_subagents, agent_as_a_service]
    gloss: >
      R11 — a single conversational assistant with no tool access is assistant_copilot;
      so is one whose tools can only READ (retrieval, lookups). Once it can change
      anything outside the conversation (send, write, book, file), it is
      autonomous_single — or orchestrator_subagents if it spawns agents (v0.3
      boundary clarification).
  - id: C5
    label: Capability
    question: "What can it do? Choose every capability that applies."
    group: what_it_does
    type: multi_enum
    comparability: true
    values: [information_drafting, official_communication, business_transaction,
             computer_use, code_execution, data_analysis, physical_actuation]
    gloss: "R11 — no-tool conversational assistant = information_drafting only."
  - id: C5a
    label: Capability specifics
    question: "Describe the specifics of those capabilities — what exactly does it produce or do?"
    group: what_it_does
    type: text
  - id: C6
    label: Underlying model(s) & how it decides
    question: "Which model(s) is it built on, and how does it decide — does it plan or choose tools?"
    group: what_it_does
    type: text
  - id: C7
    label: High-impact determination (OMB M-25-21)
    question: "Is the agent's output used as a principal basis for a decision or action that has a legal, material, binding, or significant effect on rights, access to services, health and safety, critical infrastructure, or strategic assets?"
    help:
      - "(a) civil rights, civil liberties, or privacy"
      - "(b) access to education, housing, insurance, credit, employment, and other programs"
      - "(c) access to critical government resources or services"
      - "(d) human health and safety"
      - "(e) critical infrastructure or public safety"
      - "(f) strategic assets or resources (incl. high-value property and information marked sensitive or classified)"
    group: what_it_does
    type: enum
    comparability: true
    values: [high_impact, presumed_high_but_determined_not, not_high_impact, not_yet_determined]
    note: >
      R1 — faithful M-25-21 test (was a Y/N). Categories (a)-(f) verbatim from the
      M-25-21 §5 "High-Impact AI" definition (verified against the memo 2026-07-24).
      The memo does not define "principal basis"; the card reads it as: the decision
      would likely differ without the agent's output (interpretive gloss, ours — memo
      fn 27 requires only that the output "actually serve as a principal basis").
      Human involvement does not exempt: "a high-impact determination is possible
      whether there is or is not human oversight" (§4(a)). §6 lists purposes presumed
      high-impact (a-o); stepping down from the presumption requires a determination
      record (C7a — M-25-21 §4(a) written-documentation requirement).
      not_yet_determined no longer blocks (v0.3): the card completes with a
      PROVISIONAL level and a to_resolve item — see impact_derivation.
      Drives OMB high-impact status (output 1 of the derivation).
  - id: C7a
    label: Determination record
    question: "Who made the high-impact determination, in what role, on what date — and on what rationale?"
    group: what_it_does
    type: text
    note: >
      v0.3 (legal review F8) — REQUIRED when C7 = presumed_high_but_determined_not:
      M-25-21 §4(a) requires written documentation by an appropriate agency official
      for a determination that a presumed-high use case is not high-impact.
      Recommended for every other answered C7. Without it, the card's most
      consequential legal judgment leaves no trace for a reviewer or ombudsman.
  - id: C8
    label: Data sensitivity
    question: "What is the most sensitive data it touches in operation — including what users type or say to it?"
    group: what_it_touches
    type: enum
    comparability: true
    values: [none_public, internal, personal_pii, sensitive]
    gloss: "R4 — classify by the most sensitive data the agent touches in operation (incl. user input), not the knowledge-store classification."
  - id: C8a
    label: Datasets / source of truth
    question: "Which datasets or sources of truth does it use?"
    group: what_it_touches
    type: list
  - id: C9
    label: Tools, systems & APIs it can reach
    question: "Which tools, systems, and APIs can it reach — everything it can call or act on?"
    group: what_it_touches
    type: list
  - id: C10
    label: Autonomy level
    question: "How much does the agent do before a human is involved?"
    group: autonomy_control
    type: enum
    comparability: true
    public: true
    values: [informs, recommends, acts_with_approval, acts_without_approval]
    gloss: "R4 — 'acts' includes any effect outside the conversation (notifications, flags, records, messages)."
  - id: C11
    label: Reversibility of its actions
    question: "Once it acts, how hard is it to undo?"
    help:
      - "a draft a person edits before it goes anywhere = fully_reversible"
      - "once an answer, message, or change reaches someone who may rely or act on it, it is no longer fully reversible"
      - "a public communication, a payment, a benefits decision, or deleting records = hard_to_reverse"
    group: autonomy_control
    type: enum
    comparability: true
    values: [fully_reversible, reversible_with_effort, hard_to_reverse]
    gloss: "R2 — judged at the point of external effect, not at generation."
  - id: C11a
    label: Maximum consequence severity
    question: "What is the worst plausible consequence of a wrong or harmful output, at the scale it operates?"
    group: autonomy_control
    type: enum
    comparability: true
    values: [negligible, limited, serious, severe]
    note: >
      R2 (new) — worst plausible consequence at operating scale, a second axis
      alongside reversibility. Anchors: external write-access/publication/financial
      effect -> >= limited; wrong actionable guidance or >10k people/records ->
      >= serious; bodily harm / loss of rights / mass irreversible -> severe.
  - id: C12
    label: Safety red-line (the agentic trifecta)
    question: "Without a human in the loop, does it combine all three of: acting on untrusted or external input; access to non-public personal or protected data; and the ability to change anything outside the conversation?"
    help:
      - "(a) untrusted/external input — anything a member of the public or an external system can put in front of it"
      - "(b) non-public personal or protected data — judged independently of your data-sensitivity answer (C8)"
      - "(c) actions that change anything outside the conversation"
      - "all three at once, with no human in the loop, is the red-line"
    group: autonomy_control
    type: enum
    values: ["no", yes_with_compensating_controls, yes_unresolved]  # "no" quoted: bare no is YAML-1.1 False
    note: >
      R12 — was Y/N. Trifecta = (a) untrusted/external input + (b) non-public
      personal/protected data, judged INDEPENDENTLY of C8 + (c) actions that change
      anything outside the conversation, all without a human in the loop.
      yes_with_compensating_controls = mitigated (name controls). yes_unresolved
      derives High and adds a to_resolve item: the card strongly recommends not
      entering production until one trifecta leg is broken or named compensating
      controls are in place (v0.3 — recommendation, not prohibition; see adoption).
  - id: C13
    label: How a person stops or overrides it
    question: "How does a person stop or override it?"
    group: autonomy_control
    type: text
  - id: C14
    label: Accountable owner (role, not person)
    question: "Who is answerable for it in operation — a role or title, not a person?"
    group: accountability
    type: text
    public: true
  - id: C15
    label: Deploying agency / unit + contact point
    question: "Which agency or unit deploys it, and what is the contact point?"
    group: accountability
    type: text
    public: true
    note: "R10 — contact point is now public (ATRS Tier 1)."
  - id: C16
    label: Vendor & exit basics
    question: "Who is the vendor (or is it in-house), under what contract vehicle — and in one sentence, what leaves with you if you switch?"
    group: accountability
    type: text
    note: "R8 — broadened from 'Vendor / provider': vendor or in-house; contract vehicle; one line on what leaves with you if you switch. Full exit questions in E18."
  - id: C17
    label: Government function served
    question: "Which government function does it serve?"
    group: placement
    type: enum
    comparability: true
    public: true
    note: "OMB M-25-21 Use Case Topic Area, verbatim (unchanged; desk-audit B faithful)."
    values: [administrative_functions, cybersecurity, emergency_management,
             energy_and_environment, government_benefits_processing, health_and_medical,
             human_resources, information_technology, international_affairs,
             law_enforcement, procurement_and_financial_management, science,
             service_delivery, transportation, other]
  - id: C18
    label: Lifecycle stage
    question: "Where is it in its lifecycle?"
    group: placement
    type: enum
    comparability: true
    public: true
    values: [pre_deployment, pilot, deployed, retired]
    note: "R7 — pre_deployment added (OMB development-stage, complete). On retirement the card is closed, not deleted."
  - id: C19
    label: Which base risks apply
    question: "Which base risks apply? Every AI system carries these — choose all that fit."
    group: risk
    type: list
    suggested_values: [confabulation_inaccurate_output, harmful_bias, data_privacy, information_security]
    note: "R11 — base risks every AI system carries (NIST AI 600-1 named categories)."
  - id: C19a
    label: Which agentic hazards apply
    question: "Which agentic hazards apply? Answer if it acts on tools/systems or takes multi-step autonomous action; a system with no tools at all marks this not_applicable — that is a complete answer."
    group: risk
    type: list
    suggested_values: [prompt_injection, unsafe_irreversible_actuation, over_privileged_tools,
                       memory_poisoning, cascading_failure]
    note: >
      R11 (new) — answer if the agent acts on tools/systems or takes multi-step
      autonomous action; only a system with NO tools marks this not_applicable.
      v0.3 boundary clarification: retrieval-only grounding (RAG, document/web
      lookup) still answers this field — retrieved content is untrusted input, so
      prompt_injection applies at minimum, even with no write-capable tools.
  - id: C20
    label: Pre-deployment testing / evaluation done
    question: "Has an actual evaluation of this system been done before deployment, with results? (Y/N + link)"
    group: risk
    type: bool_plus_link
    gloss: "R4 — a register's 'impact assessed: yes' flag or a framework mapping is NOT testing; Yes only for an actual evaluation of THIS system, with results."
  - id: C21
    label: Public plain-language summary published
    question: "Is a public plain-language summary published? (Y/N + link)"
    group: risk
    type: bool_plus_link
    public: true
  - id: C22
    label: Disclosure — are people told they're dealing with an agent
    question: "Are the people who interact with it told they're dealing with an AI agent? How?"
    group: risk
    type: bool_plus_text
    public: true
    note: >
      v0.3 (legal review F6) — promoted from Extended (was E14a): disclosure is a
      Core question for any public-facing agent, whatever the Impact Level; AI
      disclosure is where states have legislated first. An internal-only agent may
      answer not_applicable — a complete answer.

extended_fields:
  - id: E1
    label: Whose identity does it act under
    question: "When it acts — sends an email, calls a system — whose identity does it use?"
    group: identity_delegation
    type: text
    gloss: "Own dedicated service identity, a shared team account, or a specific person's login? If you can't tell whose authority it acted under, you can't hold anyone accountable when it goes wrong. Unsure is common — record what's true."
  - id: E2
    label: On whose authority — human principal/sponsor
    question: "On whose authority does it act — who is the human principal or sponsor?"
    group: identity_delegation
    type: text
  - id: E3
    label: What it's allowed to do (tasks; tools/data/APIs)
    question: "What is it allowed to do: (a) which tasks and workflows; (b) which tools, data, and APIs?"
    group: identity_delegation
    type: text
  - id: E4
    label: Sub-agents (can it create agents; scoped; recorded)
    question: "Can it create other agents? If so, can they do more than it can (they shouldn't), and is it recorded which agent created which?"
    group: identity_delegation
    type: bool_plus_text
  - id: E5
    label: Actions traceable to responsible human
    question: "Can its actions be traced back to the responsible human? How?"
    group: identity_delegation
    type: bool_plus_text
  - id: E6
    label: "Automation boundary (per action-type: autonomous / confirm / human-only)"
    question: "For each action or decision type: does it run on its own, confirm with a human first, or stay human-only?"
    group: automation_detail
    type: table
    modes: [autonomous, confirm_first, human_only]
    gloss: "Be specific — 'all financial actions need approval' is too coarse; say which ones."
  - id: E7
    label: Actions always requiring human approval
    question: "Which actions always require human approval?"
    group: automation_detail
    type: list
  - id: E8
    label: What's logged (enough to reconstruct a decision)
    question: "What is logged — enough to reconstruct a decision? Does the log distinguish what the agent did on its own from what a person told it to do?"
    group: oversight
    type: text
  - id: E9
    label: Live monitoring + alert triggers
    question: "Is there live monitoring, and what triggers an alert?"
    group: oversight
    type: bool_plus_text
  - id: E10
    label: Oversight cadence
    question: "What is the oversight cadence — event-triggered or continuous?"
    group: oversight
    type: enum
    values: [event_triggered, continuous]
    gloss: "For agents, continuous is usually needed — approval-at-launch alone breaks down."
  - id: E11
    label: Independent review (who, not on build team)
    question: "Who reviews it independently — someone not on the build team?"
    group: oversight
    type: text
  - id: E12
    label: What change forces the card to be re-done (drift trigger)
    question: "What change forces this card to be re-done — the drift trigger?"
    group: oversight
    type: text
  - id: E13
    label: Appeal / contest route
    question: "How does someone affected challenge an outcome?"
    group: redress
    type: text
    public: true
  - id: E14
    label: Who's affected, incl. indirectly
    question: "Who is affected by it, including indirectly?"
    group: redress
    type: list
    public: true
  # E14a (disclosure) moved to Core as C22 in v0.3 — see legal review F6.
  - id: E15
    label: Extra safeguard for fully-automated consequential decisions
    question: "What extra safeguard exists for fully-automated consequential decisions?"
    group: redress
    type: text
  - id: E16
    label: Vendor & procurement basis
    question: "Who is the supplier, on what procurement route, and under what data-access terms?"
    group: cost_lockin
    type: text
  - id: E17
    label: Value vs. the status quo
    question: "What is it compared against, and what is the expected benefit over the status quo?"
    group: cost_lockin
    type: text
  - id: E18
    label: "Getting out (M-25-22: knowledge transfer, data+model portability, code/model rights, notice, closeout)"
    question: "If you had to leave this vendor, could you? Walk the M-25-22 checklist item by item."
    help:
      - "knowledge-transfer arrangements"
      - "data AND model portability (including your prompts, traces, fine-tunes, and vector stores)"
      - "licensing and pricing transparency"
      - "rights to code and models produced under the contract"
      - "vendor-change notice"
      - "rollback and closeout data-transfer plan"
    group: cost_lockin
    type: text
    note: >
      R8 — anchored to OMB M-25-22 (v0.1's 'no precedent' claim was false). Checklist
      verified against the memo 2026-07-24: knowledge transfer + portability + licensing/
      pricing transparency = §4(c)(ii); rights to code/models = §4(d)(iii)(C); rollback =
      §4(d)(iii)(F); vendor-change notice = §4(d)(iii)(G); closeout data-transfer plan =
      §4(f)(i). The parenthetical (prompts, traces, fine-tunes, vector stores) is the
      card's elaboration of "data and model portability", not memo text.

# ---- Derived signal: Impact Level (card v0.3, "Your Impact Level") ----
# R3: two outputs computed separately; final level = the higher. Contract 2
# (v0.3, legal review F2/F7): the card NEVER blocks — verdicts that halted in
# contract 1 now complete with a provisional level and a to_resolve list.
# Implemented in skills/agent-governance-card/scripts/derive_impact.py (pinned to
# derivation_contract_version above).
impact_derivation:
  output_1_omb_high_impact_status:
    from: C7
    high_if: "C7 == high_impact"
    not_high_if: "C7 in [presumed_high_but_determined_not, not_high_impact]"
    pending_if: >
      C7 == not_yet_determined OR C7 unanswered — the card still completes: the
      final level is the operational tier marked PROVISIONAL (it may rise to High
      once the determination is made), and completing the OMB determination is
      added to to_resolve. Contract 1's cannot-deploy block is retired (F2).
  output_2_operational_tier:
    inputs: [C8, C10, C11, C11a, C12]
    high_if_any:
      - "C12 == yes_unresolved"
      - "C10 == acts_without_approval AND (C11 == hard_to_reverse OR severity(C11a) >= serious)"
      - "C8 == sensitive AND C10 == acts_without_approval"
    moderate_if_any_and_not_high:
      - "C8 in [personal_pii, sensitive]"
      - "C10 in [acts_with_approval, acts_without_approval]"
      - "severity(C11a) >= limited AND C10 != informs"
      - "C12 == yes_with_compensating_controls"
    low: otherwise
    unknown_floor: "R3/R6 — if any operational-tier input is unknown, tier cannot be Low (floored at Moderate)."
  final_level: >
    higher of output 1 and output 2. If output 1 is pending, final level = the
    operational tier with level_provisional = true.
  to_resolve: >
    welcoming recommendations, never prohibitions (see adoption). Entries: C7
    pending -> "complete the OMB high-impact determination before production
    access; the level may rise to High"; C12 yes_unresolved -> "the card strongly
    recommends not entering production until one trifecta leg is broken (e.g.
    human approval on external actions) or named compensating controls are in
    place — then re-answer yes_with_compensating_controls"; any unknown
    derivation input -> "resolve <field>; the tier stays floored at Moderate
    until then".
  reviewer_confirmation: "R4 — a Low result for any public-facing agent must be confirmed by a named reviewer outside the build team."
  part2_required_for: [moderate, high]
  part2_when_floored: >
    F7 (v0.3) — when Moderate ONLY because of the unknown-floor (no substantive
    trigger fired), Part 2 narrows to the automation_detail + oversight groups
    (E6-E12) plus a resolve-by suggestion, instead of all Extended questions.
    Honesty should cost ~7 questions, not 19. A substantive Moderate/High still
    completes all of Part 2.
  high_additionally_requires:   # R9 — full OMB M-25-21 §4(b) minimum-practice set
    # Verified against the memo 2026-07-24: pre_deployment_testing added (§4(b)(i),
    # was missing); independent_review and named_senior_signoff are components of the
    # impact assessment (§4(b)(ii)(F) and (G)); "tested" in tested_failsafe_killswitch
    # is the card's strengthening — the memo asks for an "appropriate fail-safe",
    # "when practicable" (§4(b)(v)).
    - pre_deployment_testing
    - ai_impact_assessment
    - independent_review
    - ongoing_monitoring_with_periodic_human_review
    - operator_training
    - tested_failsafe_killswitch
    - appeal_contest_route
    - user_public_feedback_channel
    - named_senior_signoff

# ---- Reference layers (card v0.2 "Reference" section) ----
comparability_spine: [impact_level, C4, C5, C8, C10, C11, C11a, C17, C18]   # R2 adds C11a
public_layer: [C1, C2, C3, C15, C4, C10, impact_level, C14, C17, C18, C21, C22, E13, E14]  # R10; v0.3 adds C22 (disclosure)
